<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>crt-glitch — минимальный пример</title>
<style>
  body { margin: 0; background: #000; color: #eee; font: 14px/1.5 ui-monospace, Menlo, monospace; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px; display: grid; gap: 24px; }
  crt-glitch { aspect-ratio: 16 / 9; }
  crt-glitch img { display: block; width: 100%; height: 100%; object-fit: cover; }
</style>
<script type="module" src="../src/crt-glitch.js"></script>
</head>
<body>
<main>
  <p>Картинка ниже проигрывает переход, когда появляется на экране. Наведите на вторую — переход повторится.</p>

  <crt-glitch trigger="visible" preset='{"ca":0.003,"tear":0.08}'>
    <img src="https://picsum.photos/id/1062/1600/900" crossorigin="anonymous" alt="Пример">
  </crt-glitch>

  <crt-glitch trigger="hover" mask="true" pixel="2" idle="0.3">
    <img src="https://picsum.photos/id/1011/1600/900" crossorigin="anonymous" alt="Пример с RGB-маской">
  </crt-glitch>
</main>
</body>
</html>
